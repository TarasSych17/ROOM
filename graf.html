<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<title>Graph with Sway Effect</title>
<style>
    body {
        margin: 0;
        background-color: #2b2b2b;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
    }
    
.scale2 {
  transition: 0.2s; 
}
.scale2:hover {
  transform: scale(1.1); 
}
    .navbar {
  overflow: hidden;
    color: #black;
  position: fixed;
  bottom: 0;
  width: 65%;
  border: 2px solid black;
  left: 0;
  right: 0;
  margin: 0 auto;
  text-align: center;
  border-radius: 15px;
  background: linear-gradient(to bottom, #470000, #821300);
  
}

    svg {
        width: 900px;
        height: 900px;
    }

    .node-group {
        cursor: pointer;
        transition: transform 0.2s ease;
        transform-origin: center;
        animation: sway 2s infinite ease-in-out; /* додана анімація */
    }

    .node-group:hover {
        transform: scale(1.2); /* збільшення */
    }

    .node {
        fill: #d3d3d3;
        transition: fill 0.2s;
    }

    .node-group:hover .node {
        fill: #ffffff;
    }

    .line {
        stroke: black;
        stroke-width: 2;
        transition: stroke 0.2s ease;
    }

    .line.highlight {
        stroke: #ff4500; /* підсвічування лінії */
    }

    text {
        fill: black;
        font-size: 11px;
        text-anchor: middle;
        dominant-baseline: middle;
        pointer-events: none;
    }

    .node-group.dimmed .node {
        fill: #888888; /* затемнення інших вузлів */
    }

    /* анімація коливання вузлів */
    @keyframes sway {
        0% {
            transform: translate(0, 0);
        }
        25% {
            transform: translate(5px, 5px); /* легке зсування */
        }
        50% {
            transform: translate(0, -5px); /* легке зсування */
        }
        75% {
            transform: translate(-5px, -5px); /* легке зсування */
        }
        100% {
            transform: translate(0, 0);
        }
    }
</style>
</head>
<body>

<svg id="graph"></svg>

<script>
const svg = document.getElementById("graph");

const center = { x: 450, y: 450 };

// групи
const linesGroup = createGroup();
const nodesGroup = createGroup();
const topGroup = createGroup();

const allNodes = [];
const MIN_DISTANCE = 70;

// центр
addNode(center.x, center.y);

// рівень 1
const level1 = [];
const radius1 = 200;

for (let i = 0; i < 5; i++) {
    const angle = (2 * Math.PI / 5) * i;
    const x = center.x + radius1 * Math.cos(angle);
    const y = center.y + radius1 * Math.sin(angle);

    level1.push({ x, y });
    addNode(x, y);
    createLine(center.x, center.y, x, y);
}

// рівень 2
let labelCount = 1;

level1.forEach((parent, index) => {
    const childrenCount = index === 4 ? 2 : 3;

    for (let i = 0; i < childrenCount; i++) {
        const pos = findFreePosition(parent);
        if (!pos) continue;

        addNode(pos.x, pos.y);
        createLine(parent.x, parent.y, pos.x, pos.y);
        createNodeVisual(pos.x, pos.y, "Лінк " + labelCount++, "#");
    }
});

// малюємо рівень 1
level1.forEach((node, i) => {
    createNodeVisual(node.x, node.y, "Рівень 1-" + (i+1), "#");
});

// центр зверху
createNodeVisual(center.x, center.y, "Головний", "#", true);


// ===== логіка =====

function findFreePosition(parent) {
    let attempts = 0;

    while (attempts < 100) {
        const angle = Math.random() * Math.PI * 2;
        const distance = 120 + Math.random() * 80;

        const x = parent.x + Math.cos(angle) * distance;
        const y = parent.y + Math.sin(angle) * distance;

        if (isFarEnough(x, y)) return { x, y };

        attempts++;
    }

    return null;
}

function isFarEnough(x, y) {
    return allNodes.every(node => {
        const dx = node.x - x;
        const dy = node.y - y;
        return Math.sqrt(dx*dx + dy*dy) > MIN_DISTANCE;
    });
}

function addNode(x, y) {
    allNodes.push({ x, y });
}


// ===== SVG =====

function createGroup() {
    const g = document.createElementNS("http://www.w3.org/2000/svg", "g");
    svg.appendChild(g);
    return g;
}

function createNodeVisual(x, y, label, link, isTop = false) {
    const group = document.createElementNS("http://www.w3.org/2000/svg", "a");
    group.setAttribute("href", link);
    group.setAttribute("class", "node-group");

    const circle = document.createElementNS("http://www.w3.org/2000/svg", "circle");
    circle.setAttribute("cx", x);
    circle.setAttribute("cy", y);
    circle.setAttribute("r", isTop ? 40 : 25);
    circle.setAttribute("class", "node");

    const text = document.createElementNS("http://www.w3.org/2000/svg", "text");
    text.setAttribute("x", x);
    text.setAttribute("y", y);
    text.textContent = label;

    group.appendChild(circle);
    group.appendChild(text);

    group.addEventListener("mouseenter", () => onNodeHover(group, x, y));
    group.addEventListener("mouseleave", () => onNodeLeave(group));

    if (isTop) {
        topGroup.appendChild(group);
    } else {
        nodesGroup.appendChild(group);
    }
}

function createLine(x1, y1, x2, y2) {
    const line = document.createElementNS("http://www.w3.org/2000/svg", "line");
    line.setAttribute("x1", x1);
    line.setAttribute("y1", y1);
    line.setAttribute("x2", x2);
    line.setAttribute("y2", y2);
    line.setAttribute("class", "line");

    linesGroup.appendChild(line);
}

function onNodeHover(group, x, y) {
    // Знаходимо всі лінії, що з'єднують цей вузол
    const relatedLines = [];
    linesGroup.querySelectorAll("line").forEach(line => {
        const x1 = parseFloat(line.getAttribute("x1"));
        const y1 = parseFloat(line.getAttribute("y1"));
        const x2 = parseFloat(line.getAttribute("x2"));
        const y2 = parseFloat(line.getAttribute("y2"));

        if ((x1 === x && y1 === y) || (x2 === x && y2 === y)) {
            relatedLines.push(line);
        }
    });

    // Підсвічуємо лінії
    relatedLines.forEach(line => {
        line.classList.add("highlight");
    });

    // Зменшуємо інші вузли
    nodesGroup.querySelectorAll(".node-group").forEach(otherGroup => {
        if (otherGroup !== group) {
            otherGroup.classList.add("dimmed");
        }
    });
}

function onNodeLeave(group) {
    // Приглушуємо лінії
    linesGroup.querySelectorAll(".highlight").forEach(line => {
        line.classList.remove("highlight");
    });

    // Відновлюємо всі вузли
    nodesGroup.querySelectorAll(".node-group").forEach(otherGroup => {
        otherGroup.classList.remove("dimmed");
    });
}
</script>

</body>
</html>
